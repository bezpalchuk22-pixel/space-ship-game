
<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Ship Game — лабораторна робота № 2</title>
</head>
<body>
    <main id="app">
        <header class="hud">
            <div>Рахунок: <strong id="score">0</strong></div>
            <div>Здоров'я: <strong id="hp">100</strong></div>
            <div>Об'єктів: <strong id="entities">0</strong></div>
        </header>

        <canvas id="game"></canvas>

        <section class="help">
            <p><strong>Керування</strong></p>
            <p>WASD або стрілки — рух</p>
            <p>Space — стрільба</p>
            <p>H — самонавідна куля</p>
            <p>P — створити аптечку</p>
        </section>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
